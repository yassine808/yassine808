<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Terminal window: cat now.txt — building Facturio, automating Windows with PowerShell and Python, 359 skills in Claude Code">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a22"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="718" height="218" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="720" height="220" fill="url(#win)"/>
    <rect x="0" y="0" width="720" height="36" fill="#161b22"/>
    <line x1="0" y1="36" x2="720" y2="36" stroke="#21262d" stroke-width="1"/>
    <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="18" r="6" fill="#27c93f"/>
    <text x="360" y="23" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">yassine808@github</text>
  </g>
  <rect x="1" y="1" width="718" height="218" rx="10" fill="none" stroke="#30363d"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="26" y="72" opacity="0">
      <tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">cat now.txt</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.06;1" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="100" fill="#79c0ff" opacity="0">
      • building Facturio — invoicing for freelancers
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.24;1" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="128" fill="#d2a8ff" opacity="0">
      • automating Windows with PowerShell &amp; Python
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.42;1" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="156" fill="#7ee787" opacity="0">
      • 359 skills and counting inside Claude Code
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.6;1" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
    </text>
    <g opacity="0">
      <text x="26" y="184"><tspan fill="#7ee787">$ </tspan></text>
      <rect x="46" y="170" width="9" height="18" fill="#58a6ff">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.76;1" calcMode="discrete" dur="13s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
